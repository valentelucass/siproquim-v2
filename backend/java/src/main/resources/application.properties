spring.application.name=siproquim-v2
server.address=127.0.0.1
server.port=${SIPROQUIM_PORTA:8765}
server.error.include-message=never
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=65MB
siproquim.dados=${SIPROQUIM_DADOS:../../database}
siproquim.python=${SIPROQUIM_PYTHON:python}
siproquim.extrator=${SIPROQUIM_EXTRATOR:../python/extrair.py}
siproquim.tempo-extracao-segundos=${SIPROQUIM_TIMEOUT:600}
siproquim.origem-ui=${SIPROQUIM_ORIGEM_UI:http://localhost:5173}
siproquim.token=${SIPROQUIM_TOKEN:}
siproquim.downloads=${SIPROQUIM_DOWNLOADS:${user.home}/Downloads}
siproquim.versao=2.0.6
siproquim.canal=https://github.com/valentelucass/siproquim-v2/releases
